# Fire Intelligence Platform 一键部署（M7，见 docs/DEPLOYMENT.md）
#
# 默认：backend 单容器 + SQLite（数据落在 backend-data 卷），即可完整跑通。
# 生产 PostgreSQL：在根目录 .env 中设置
#   DATABASE_URL=postgresql+psycopg://fire:fire@postgres:5432/fire
# 并启用 postgres 服务（默认即启动；不需要 SQLite 时可只依赖 postgres）。
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # 容器内数据目录固定在 /app/data（卷挂载点）
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/app.db}
      STORAGE_DIR: ${STORAGE_DIR:-/app/data/storage}
      VECTOR_STORE_DIR: ${VECTOR_STORE_DIR:-/app/data/vectorstore}
      MEDIA_TEMP_DIR: ${MEDIA_TEMP_DIR:-/app/data/temporary}
    volumes:
      - backend-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    restart: unless-stopped

  # 生产选项：PostgreSQL。DATABASE_URL 指向它（见上方注释）
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fire}
      POSTGRES_DB: ${POSTGRES_DB:-fire}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  backend-data:
  postgres-data:
