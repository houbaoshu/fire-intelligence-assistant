version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fire
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fire-secret}
      POSTGRES_DB: fire_intelligence
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fire"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://fire:${POSTGRES_PASSWORD:-fire-secret}@db:5432/fire_intelligence
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-}
      VISION_MODEL: ${VISION_MODEL:-}
      OCR_MODEL: ${OCR_MODEL:-}
      SPEECH_MODEL: ${SPEECH_MODEL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      RERANK_MODEL: ${RERANK_MODEL:-}
      RERANK_BASE_URL: ${RERANK_BASE_URL:-}
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_ROOT: /app/data/storage
      TASK_WORKER_IN_PROCESS: "true"
      REGISTRATION_ENABLED: "true"
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@example.com}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-admin123456}
    volumes:
      - storage:/app/data/storage
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
  storage:
