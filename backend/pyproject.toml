[project]
name = "fire-intelligence-backend"
version = "0.1.0"
description = "Fire Intelligence Platform backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pyjwt>=2.9",
    "pwdlib[argon2,bcrypt]>=0.2",
    "python-multipart>=0.0.9",
    "email-validator>=2.0",
    "python-docx>=1.1",
    "docxtpl>=0.19",
    "httpx>=0.27",
    "numpy>=1.26",
    "Pillow>=10.0",
    "imageio-ffmpeg>=0.5",
    "pypdf>=4.0",
    "python-pptx>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
