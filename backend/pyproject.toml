[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fire-intelligence-backend"
version = "0.1.0"
description = "Fire Intelligence Platform backend (FastAPI)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "PyJWT>=2.8",
  "bcrypt>=4.1",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "python-docx>=1.1",
  "pypdf>=4.2",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
